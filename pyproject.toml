[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "anubis-cli"
version = "1.0.0rc1"
description = "Local environment and infrastructure operations CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "click==8.4.2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "tomli-w==1.2.0",
]

[project.scripts]
anubis = "anubis.main:main"

[tool.hatch.build.targets.wheel]
packages = ["anubis"]

[tool.hatch.build.targets.sdist]
include = [
    "/anubis",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/README.es.md",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.uv]
required-version = ">=0.11.0"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
