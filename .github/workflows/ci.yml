name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: 3.12.3

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check dependencies
        run: uv pip check

      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

  scan:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          scanners: vuln,secret,config
          severity: CRITICAL,HIGH

  build:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.11.29
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build public artifacts
        run: uv build --no-sources --out-dir "${RUNNER_TEMP}/dist"

      - name: Inspect artifact contents
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          forbidden = {"deployment.yml", "anubis.yaml", ".env", ".pdm-build"}
          archives = list((Path(os.environ["RUNNER_TEMP"]) / "dist").glob("anubis_cli-*"))
          assert len(archives) == 2, archives
          for archive in archives:
              if archive.suffix == ".whl":
                  names = zipfile.ZipFile(archive).namelist()
              else:
                  names = tarfile.open(archive).getnames()
              assert not any(Path(name).name in forbidden for name in names), names
          PY
